name: skyview_app
description: Kisan Mitra Farm OS mobile client
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  audioplayers: ^6.1.0
  record: ^7.1.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  flutter_markdown: ^0.7.4
  fl_chart: ^1.0.0
  easy_localization: ^3.0.7+1
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  intl: any
  google_fonts: ^6.3.0
  connectivity_plus: ^7.3.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  speech_to_text: ^7.5.0
  geolocator: ^14.0.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_light.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/logo_light.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

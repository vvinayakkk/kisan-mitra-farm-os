name: kisan-mitra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyview_v3_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skyview_v3_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    command: ["python", "data_platform/v3/bootstrap.py", "--seed-demo"]
    environment:
      PGHOST: db
      PGDATABASE: skyview_v3_demo
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      V3_APP_PASSWORD: ${V3_APP_PASSWORD:?Set V3_APP_PASSWORD in .env.docker}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      SKYVIEW_DATA_MODE: v3_demo
      V3_DATABASE_URL: postgresql+psycopg2://skyview_v3_api:${V3_APP_PASSWORD:?Set V3_APP_PASSWORD in .env.docker}@db:5432/skyview_v3_demo
      V3_DEMO_FARMER_KEY: DEMO-F0001
      V3_RAW_STORAGE_DIR: /app-data/raw
      ASSISTANT_STORAGE_DIR: /app-data/assistant
      ENABLE_MQTT: "False"
      PORT: "8001"
    volumes:
      - app-data:/app-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
